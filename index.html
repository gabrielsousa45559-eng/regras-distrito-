<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10090b">
  <meta name="description" content="Regras oficiais do Distrito 011 Paulista — roleplay, cidade, polícia, ações ilegais e sistema jurídico.">
  <title>Regras | Distrito 011 Paulista</title>
  <link rel="icon" href="assets/distrito011-logo.png" type="image/png">
  <style>
    :root{--bg:#10090b;--panel:#170e11;--panel2:#211417;--line:#392327;--text:#f2ebec;--muted:#b6a8ab;--red:#ed252d;--red2:#ff4248;--soft:#35191c;--max:1440px;--shadow:0 20px 80px #0006}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:radial-gradient(ellipse at 65% -25%,#522027 0,transparent 43%),linear-gradient(130deg,#10090b,#0b0809 55%,#140b0d);color:var(--text);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}button{color:inherit}.topbar{height:72px;position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff13;background:#10090beF;backdrop-filter:blur(18px)}.top-inner{max-width:var(--max);height:100%;margin:auto;padding:0 26px;display:flex;align-items:center;gap:26px}.brand{display:flex;align-items:center;gap:12px;min-width:240px}.brand img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 12px #ed252d33)}.brand-name{font-weight:760;letter-spacing:.02em}.brand-name small{display:block;font-size:10px;line-height:1.2;color:var(--muted);font-weight:600;letter-spacing:.16em}.top-links{display:flex;gap:10px;margin-left:auto}.top-links a{padding:9px 15px;border:1px solid transparent;border-radius:99px;color:#ddd0d2;font-size:13px;transition:.2s}.top-links a:hover,.top-links a.active{color:#fff;background:var(--red);border-color:var(--red);box-shadow:0 4px 18px #ed252d44}.top-links a.github-link{border-color:#654047;background:#1b1114;color:#f3e9eb}.top-links a.github-link:hover{border-color:var(--red);background:var(--red);color:#fff}.github-mark{margin-right:6px;font-size:15px}.search{height:42px;display:flex;align-items:center;gap:9px;border:1px solid #594044;border-radius:99px;padding:0 13px;background:#0b0709;min-width:230px;color:var(--muted)}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}.shortcut{font:11px ui-monospace,monospace;border:1px solid #58464a;padding:2px 5px;border-radius:5px;white-space:nowrap}.layout{max-width:var(--max);margin:24px auto;padding:0 26px;display:grid;grid-template-columns:245px minmax(0,1fr) 190px;gap:38px;align-items:start}.sidebar{position:sticky;top:96px;height:calc(100vh - 118px);min-height:500px;overflow:auto;border:1px solid #493237;border-radius:17px;background:#110a0ceF;padding:19px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}.side-caption{display:flex;align-items:center;gap:9px;padding:2px 10px 18px;color:#cbbfc1;font-size:13px}.status-dot{width:9px;height:9px;border-radius:3px;background:#df252d;box-shadow:0 0 12px #ed252d88}.nav-group{margin-bottom:17px}.nav-label{padding:5px 10px;color:#f2e8e9;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.nav-link{display:flex;align-items:center;gap:10px;margin:2px 0;padding:8px 10px;border-radius:10px;color:#bbaeb1;font-size:13px;line-height:1.35;transition:.16s}.nav-link:hover{background:#ffffff0b;color:white}.nav-link.active{background:linear-gradient(90deg,#491c21,#32181b);color:#ff5158;font-weight:700}.nav-icon{width:17px;text-align:center;color:#d54b51}.side-foot{margin-top:auto;padding:12px 10px 0;color:#8f8083;font-size:11px}.content{min-width:0;padding:7px 0 80px}.crumb{font-size:11px;color:#b9a9ad;letter-spacing:.08em;text-transform:uppercase}.title-row{display:flex;align-items:center;gap:16px;margin:13px 0 20px}.title-icon{width:43px;height:43px;border:1px solid #75353b;background:#351619;border-radius:12px;display:grid;place-items:center;color:#ff5a60;font-size:22px}.page-title{margin:0;font-size:34px;line-height:1.15;letter-spacing:-.04em}.lead{color:#c7b9bc;font-size:15px;max-width:790px;margin:0 0 26px}.hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid #593036;border-radius:15px;min-height:185px;margin-bottom:30px;background:#190d10;box-shadow:0 14px 50px #0005}.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#17090deF,#19090dbb 54%,#16090b44),url('assets/distrito011-banner.gif') center 44%/cover no-repeat;filter:saturate(.9)}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#10090b99,transparent 62%)}.hero-content{padding:28px 30px;max-width:640px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#ff8589;font-weight:800;text-transform:uppercase}.hero h2{font-size:27px;line-height:1.15;margin:8px 0}.hero p{color:#e4d7d9;margin:0;max-width:510px;font-size:13px}.intro-card{padding:17px 18px;border:1px solid #39272b;border-left:3px solid var(--red);border-radius:11px;background:#1b1215;margin:18px 0 27px;color:#e3d8da}.intro-card strong{display:block;margin-bottom:6px}.rule-heading{display:flex;align-items:center;gap:11px;margin:30px 0 10px;padding-top:10px;font-size:19px;scroll-margin-top:100px}.rule-heading:before{content:"";width:3px;height:20px;background:var(--red);border-radius:4px}.rule-text{margin:0 0 15px;color:#ded3d5;white-space:pre-line}.rule-list{padding-left:21px;margin:5px 0 19px;color:#ded3d5}.rule-list li{padding:3px 0 3px 4px}.rule-list li::marker{color:#ef434a}.rule-item{position:relative;border-top:1px solid #342327;margin:0;padding:17px 0 17px 30px;color:#eadfe0;white-space:pre-line}.rule-item:before{content:"";position:absolute;left:7px;top:23px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px #ed252d55}.rule-item strong{color:#ff565d}.onpage{position:sticky;top:104px;padding-top:10px}.onpage-title{font-size:10px;font-weight:800;color:#a99a9d;letter-spacing:.13em;margin-bottom:12px}.onpage-list{display:flex;flex-direction:column;gap:4px}.onpage-list a{font-size:12px;color:#a99a9d;padding:7px 10px;border-radius:8px;line-height:1.35}.onpage-list a:hover,.onpage-list a.active{background:#492327;color:#ff5158}.footer{margin-top:55px;border-top:1px solid var(--line);padding-top:19px;color:#938589;font-size:12px}.footer b{color:#d2c5c7}.empty{padding:20px;border:1px solid var(--line);border-radius:12px;background:#160e10;color:var(--muted)}.mobile-menu{display:none}
    @media(max-width:1100px){.layout{grid-template-columns:225px minmax(0,1fr);gap:28px}.onpage{display:none}.search{min-width:190px}.brand{min-width:205px}.top-links a{padding:8px 11px}}
    @media(max-width:720px){.topbar{height:64px}.top-inner{padding:0 15px;gap:12px}.brand{min-width:0;flex:1;gap:8px}.brand img{width:35px;height:35px}.brand-name{font-size:13px}.brand-name small{font-size:9px}.top-links{display:flex;margin:0}.top-links a:not(.github-link){display:none}.top-links a.github-link{padding:9px 11px;font-size:12px;white-space:nowrap}.search{min-width:0;width:42px;height:40px;padding:0 11px;border-radius:12px}.search:focus-within{width:min(230px,62vw)}.search input{display:none}.search:focus-within input{display:block}.shortcut{display:none}.mobile-menu{display:grid;place-items:center;width:42px;height:40px;border:1px solid #493237;background:#170e11;border-radius:12px;font-size:19px}.layout{display:block;margin:16px auto;padding:0 15px}.sidebar{display:none;position:fixed;z-index:30;left:12px;right:12px;top:70px;height:calc(100dvh - 85px);min-height:0;box-shadow:0 30px 100px #000c}.sidebar.open{display:flex}.content{padding-top:5px}.page-title{font-size:28px}.title-icon{width:39px;height:39px}.hero{min-height:166px;margin-bottom:22px}.hero-content{padding:24px 20px}.hero h2{font-size:24px}.rule-heading{font-size:17px}.footer{margin-top:40px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner">
    <button class="mobile-menu" id="menuButton" aria-label="Abrir categorias">☰</button>
    <a class="brand" href="#inicio" aria-label="Distrito 011 Paulista — regras"><img src="assets/distrito011-logo.png" alt=""><span class="brand-name">DISTRITO 011 <small>PAULISTA · LIVRO DE REGRAS</small></span></a>
    <nav class="top-links" aria-label="Atalhos"><a href="#intro" data-shortcut="intro">Geral</a><a href="#roleplay" data-shortcut="roleplay">Roleplay</a><a href="#illegal" data-shortcut="illegal">Ilegal</a><a href="#police" data-shortcut="police">Polícia</a><a href="#legal-system" data-shortcut="legal-system">Jurídico</a><a class="github-link" href="https://github.com/gabrielsousa45559-eng/regras-distrito-" target="_blank" rel="noopener noreferrer" aria-label="Abrir repositório do Distrito 011 no GitHub"><span class="github-mark" aria-hidden="true">⌘</span>GitHub</a></nav>
    <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Buscar regra..." autocomplete="off" aria-label="Buscar regras"><span class="shortcut">Ctrl K</span></label>
  </div></header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"><div class="side-caption"><span class="status-dot"></span> Distrito 011 Paulista</div><nav id="sideNav" aria-label="Categorias das regras"></nav><div class="side-foot">Livro de regras da cidade<br>Roleplay · Comunidade · Respeito</div></aside>
    <main class="content" id="content" tabindex="-1"></main>
    <aside class="onpage"><div class="onpage-title">☷ &nbsp; NESTA PÁGINA</div><nav class="onpage-list" id="onPageNav"></nav></aside>
  </div>
  <script src="rules-data.js"></script>
  <script>
  (()=>{
    const data=window.D011_RULES_DATA||[];
    const groups=['Geral','Roleplay','Ilegal','Polícia','Jurídico'];
    const icons={'intro':'⌂','discord':'◉','city':'▣','staff-calls':'✦','penalties':'⊘','roleplay':'◉','streamers':'▰','child-rp':'◇','social':'▤','public-places':'⌖','tv-sound':'♫','safezones':'⬡','illegal':'⚑','kidnapping':'⚿','police':'✪','legal-system':'§','judiciary':'⚖'};
    const byId=Object.fromEntries(data.map(x=>[x.id,x]));
    const nav=document.getElementById('sideNav'), content=document.getElementById('content'), toc=document.getElementById('onPageNav'), search=document.getElementById('searchInput'), sidebar=document.getElementById('sidebar');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function makeNav(){nav.innerHTML=groups.map(g=>{const items=data.filter(x=>x.group===g);if(!items.length)return '';return `<div class="nav-group"><div class="nav-label">${esc(g)}</div>${items.map(x=>`<a class="nav-link" href="#${x.id}" data-id="${x.id}"><span class="nav-icon">${icons[x.id]||'•'}</span><span>${esc(x.title)}</span></a>`).join('')}</div>`}).join('')}
    function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
    function renderBlocks(section){let n=0;return section.blocks.map(b=>{if(b.type==='heading'){const id=`${section.id}-${slug(b.text)}-${n++}`;return `<h2 class="rule-heading" id="${id}">${esc(b.text)}</h2>`}if(b.type==='list')return `<ul class="rule-list">${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;if(b.type==='rule'){const match=b.text.match(/^(\d{1,3}(?:[.)]|\s+))\s*(.*)$/s);return `<div class="rule-item">${match?`<strong>${esc(match[1])}</strong> ${esc(match[2])}`:esc(b.text)}</div>`}return `<p class="rule-text">${esc(b.text)}</p>`}).join('')}
    function render(id){const s=byId[id]||data[0];if(!s)return;history.replaceState(null,'',`#${s.id}`);const isHome=s.id==='intro';const lead=isHome?'Consulte as regras e orientações oficiais para participar da cidade com respeito, imersão e bom roleplay.':`Consulte as orientações de ${s.title.toLowerCase()} do Distrito 011 Paulista.`;
      content.innerHTML=`<div class="crumb">${esc(s.group)} / Distrito 011 Paulista</div><div class="title-row"><div class="title-icon">${icons[s.id]||'§'}</div><h1 class="page-title">${esc(s.title)}</h1></div><p class="lead">${lead}</p>${isHome?`<section class="hero"><div class="hero-content"><div class="eyebrow">Distrito 011 Paulista · Livro oficial</div><h2>Regras da cidade</h2><p>Leia as diretrizes da comunidade e conheça as regras que mantêm o roleplay justo e organizado.</p></div></section>`:''}<div class="intro-card"><strong>${isHome?'Bem-vindo ao livro de regras':'Sobre esta categoria'}</strong>${isHome?'As regras abaixo foram organizadas por assunto para facilitar a leitura. Use a navegação lateral ou a busca para encontrar uma regra.':'O conteúdo desta página corresponde à categoria selecionada no livro de regras da cidade.'}</div><article>${renderBlocks(s)}</article><div class="footer"><b>DISTRITO 011 · PAULISTA</b><br>Regras organizadas por categoria a partir do livro fornecido pela cidade.</div>`;
      const headings=[...content.querySelectorAll('h2.rule-heading')];toc.innerHTML=headings.map(h=>`<a href="#${h.id}">${esc(h.textContent)}</a>`).join('');document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.id===s.id));document.querySelectorAll('.top-links a').forEach(a=>a.classList.toggle('active',a.dataset.shortcut===s.id));sidebar.classList.remove('open');content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}
    if(!data.length){
      nav.innerHTML='<div class="empty">Não foi possível abrir o arquivo das regras. Abra pelo endereço do site, com a pasta completa, ou extraia o ZIP antes de abrir o index.html.</div>';
      content.innerHTML='<div class="crumb">Distrito 011 Paulista</div><div class="title-row"><div class="title-icon">!</div><h1 class="page-title">Regras indisponíveis</h1></div><p class="lead">Os dados das categorias não foram carregados. Verifique se rules-data.js está ao lado deste arquivo e abra a página a partir da pasta extraída.</p>';
      toc.innerHTML='';
    }
    makeNav();
    nav.addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(a){e.preventDefault();render(a.dataset.id)}});
    document.querySelector('.top-links').addEventListener('click',e=>{const a=e.target.closest('[data-shortcut]');if(a){e.preventDefault();render(a.dataset.shortcut)}});
    document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();render('intro')});
    document.getElementById('menuButton').addEventListener('click',()=>sidebar.classList.toggle('open'));
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}if(e.key==='Escape'){search.blur();sidebar.classList.remove('open')}});
    search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase('pt-BR');if(q.length<2){makeNav();return}let matches=[];for(const s of data){const text=[s.title,...s.blocks.flatMap(b=>b.type==='list'?b.items:[b.text||''])].join(' ').toLocaleLowerCase('pt-BR');if(text.includes(q))matches.push(s)}nav.innerHTML=`<div class="nav-group"><div class="nav-label">${matches.length} resultado(s)</div>${matches.map(s=>`<a class="nav-link" href="#${s.id}" data-id="${s.id}"><span class="nav-icon">${icons[s.id]||'•'}</span>${esc(s.title)}</a>`).join('')||'<div class="side-foot">Nenhuma regra encontrada.</div>'}</div>`});
    document.addEventListener('click',e=>{const a=e.target.closest('.onpage-list a');if(a){e.preventDefault();document.getElementById(decodeURIComponent(a.hash.slice(1)))?.scrollIntoView({behavior:'smooth'})}});
    if(data.length){const initial=location.hash.slice(1);render(byId[initial]?initial:'intro')}
  })();
  </script>
</body>
</html>
